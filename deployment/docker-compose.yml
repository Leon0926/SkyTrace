version: '3.3'
services:
  zookeeper:
    image: wurstmeister/zookeeper
    platform: linux/amd64
    ports:
    - "2181"
    networks:
    - "api.network"
    volumes:
      - "./zookeeper/data:/opt/zookeeper-3.4.13/data"
    hostname: zookeeper
  kafka:
    image: kafka-jmx-exporter
    platform: linux/amd64
    build:
      context: ./kafka-jmx-exporter
    restart: always
    command: [start-kafka.sh]
    ports:
    - "9092:9092"
    - "7071:7071"
    hostname: kafka
    networks:
    - "api.network"
    # give the JVM time to cleanly close its zookeeper session on shutdown;
    # otherwise the broker's ephemeral znode lingers and the next `up`
    # fails to register broker.id until the stale session times out
    stop_grace_period: 60s
    healthcheck:
      # plain TCP check: kafka-topics.sh would spawn a JVM that inherits
      # KAFKA_OPTS and collides with the JMX exporter's port below
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9092'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      # topic already exists on the persisted volume; leaving
      # KAFKA_CREATE_TOPICS set spawns a kafka-topics.sh JVM at boot that
      # inherits KAFKA_OPTS and collides with the JMX exporter's port below
      KAFKA_ADVERTISED_HOST_NAME: kafka # docker-machine ip
      KAFKA_LISTENERS: INSIDE://:29092,OUTSIDE://:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:29092,OUTSIDE://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LOG_DIRS: /kafka/kafka-logs
      KAFKA_BROKER_ID: 1
      KAFKA_OPTS: "-javaagent:/opt/jmx-exporter/jmx_prometheus_javaagent.jar=7071:/opt/jmx-exporter/kafka-jmx-exporter.yml"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./kafka:/kafka/kafka-logs
    depends_on:
    - "zookeeper"
  db:
    image: mysql:5.7
    platform: linux/amd64
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
    - '3307:3306'
    depends_on:
      kafka:
        condition: service_healthy
    expose:
    - '3306'
    volumes:
    - my-db:/var/lib/mysql
    networks:           
      - "api.network"   
  receiver:
    image: receiver
    restart: always
    ports:
      - "8080:8080"
    networks:
      - "api.network"
    env_file:
      - .env
    environment:
      - TARGET_ENV=test
    volumes:
      - ./config/receiver:/config
      - ./logs:/logs
    depends_on:
      kafka:
        condition: service_healthy
    build:
      context: ../receiver
  storage:
    image: storage
    restart: always
    ports:
      - "8090:8090"
    networks:
      - "api.network"
    env_file:
      - .env
    environment:
      - TARGET_ENV=test
    volumes:
      - ./config/storage:/config
      - ./logs:/logs
      #was absoulte path
    depends_on:
      kafka:
        condition: service_healthy
    build:
      context: ../storage
  processing:
    image: processing
    restart: always
    ports:
      - "8100:8100"
    networks:
      - "api.network"
    env_file:
      - .env
    environment:
      - TARGET_ENV=test
    volumes:
      - ./config/processing:/config
      - ./logs:/logs
      - processing-db:/data
    depends_on:
      - storage
    build:
      context: ../processing
  analyzer:
    image: analyzer
    restart: always
    ports:
      - "8110:8110"
    networks:
      - "api.network"
    env_file:
      - .env
    environment:
      - TARGET_ENV=test
    volumes:
      - ./config/analyzer:/config
      - ./logs:/logs
    depends_on:
      - "kafka"
    build:
      context: ../analyzer
  dashboard:
    image: dashboard
    networks:
      - "api.network"
    depends_on:
      - "processing"
      - "analyzer"
      - "check"
      - "anomaly_detector"
    build:
      context: ../dashboard-ui
  check:
    image: check
    restart: always
    ports:
      - "8130:8130"
    networks:
      - "api.network"
    environment:
      - TARGET_ENV=test
    build:
      context: ../check
    volumes:
      - ./config/check:/config
      - ./logs:/logs
      - check-data:/data   
  nginx:
    image: nginx:latest
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # start up the nginx only when all api containers have started
    depends_on:
      - "receiver"
      - "storage"
      - "processing"
      - "analyzer"
      - "dashboard"
      - "check"
      - "anomaly_detector"
    # connects the port 80 of the nginx container to localhost:80 or localhost
    ports:
      - "80:80"
    networks:
      - "api.network"
  anomaly_detector:
    image: anomaly_detector
    restart: always
    ports:
      - "8120:8120"
    volumes:
      - ./logs:/logs
      - ./config/anomaly-detector:/config
      - anomaly-data:/data
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - api.network
    environment:
      - TARGET_ENV=test
    build:
      context: ../anomaly_detector
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - api.network
    depends_on:
      - receiver
      - storage
      - processing
      - analyzer
      - anomaly_detector
      - check
      - cadvisor
      - mysqld-exporter
      - kafka
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    # Docker Desktop's /var/run/docker.sock is a restricted API proxy that
    # cadvisor's Docker client can't validate ("Error response from
    # daemon"), and its default containerd-snapshotter storage layout
    # breaks cadvisor's legacy Docker factory (can't locate a container's
    # read-write layer) even on versions where the API call itself works.
    # Talking to containerd directly sidesteps both: it's also the same
    # socket/namespace dockerd uses under the hood on real Linux hosts.
    command:
      - "--store_container_labels=true"
      - "--containerd=/host-containerd.sock"
      - "--containerd-namespace=moby"
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /run/containerd/containerd.sock:/host-containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - api.network
    privileged: true
  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    command:
      - "--config.my-cnf=/.my.cnf"
    volumes:
      - ./mysqld-exporter/.my.cnf:/.my.cnf:ro
    ports:
      - "9104:9104"
    networks:
      - api.network
    depends_on:
      - db
  grafana:
    image: grafana/grafana:11.2.0
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - api.network
    depends_on:
      - prometheus
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    command: ["--kafka.server=kafka:9092"]
    ports:
      - "9308:9308"
    networks:
      - api.network
    depends_on:
      - kafka


volumes:
  my-db:
  processing-db:
  check-data:
  anomaly-data:
  grafana-data:

networks:
  api.network:
