events{}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        location /receiver {
            set $receiver_upstream http://receiver:8080;
            proxy_pass $receiver_upstream;
        }

        location /storage {
            set $storage_upstream http://storage:8090;
            proxy_pass $storage_upstream;
        }

        location /processing {
            set $processing_upstream http://processing:8100;
            proxy_pass $processing_upstream;
        }

        location /analyzer {
            set $analyzer_upstream http://analyzer:8110;
            proxy_pass $analyzer_upstream;
        }

        location /anomaly_detector {
            set $anomaly_detector_upstream http://anomaly_detector:8120;
            proxy_pass $anomaly_detector_upstream;
        }

        location /check {
            set $check_upstream http://check:8130;
            proxy_pass $check_upstream;
        }

        location /sockjs-node {
            set $dashboard_upstream http://dashboard:3000;
            proxy_pass $dashboard_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location / {
            set $dashboard_upstream http://dashboard:3000;
            proxy_pass $dashboard_upstream;
        }
    }
}
